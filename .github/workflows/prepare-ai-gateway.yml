name: Prepare AI Gateway SDK dependency

on:
  push:
    branches:
      - chore/ai-gateway-kimi-k3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install AI SDK using the existing Bun package manager
        run: bun add ai
      - name: Commit package manifest and resolved lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore: install ai SDK with Bun"
            git push
          fi
      - name: Build application
        run: bun run build
